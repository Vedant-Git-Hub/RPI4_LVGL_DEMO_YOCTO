<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Gallery</title>
<style>
  body { font: 16px system-ui; margin: 20px auto; padding: 0 16px; max-width: 850px; color: #f5f7fa; background: #101820 }
  h1 { margin-bottom: 4px }
  p { color: #b9c8d3 }
  button, input, select { font: inherit; padding: 8px; margin: 4px }
  button { cursor: pointer; background: #1565c0; color: white; border: 0; border-radius: 5px }
  a { color: #64d8cb }
  li { padding: 9px 0; border-bottom: 1px solid #456; display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
  li span { flex: 1; min-width: 160px; overflow-wrap: anywhere }
  progress { width: min(300px, 100%) }
  #camera-panel { margin: 16px 0; padding: 12px; border: 1px solid #456; border-radius: 8px }
  #camera-view { display: block; width: 100%; max-height: 65vh; object-fit: contain; background: #000; aspect-ratio: 4 / 3 }
  .camera-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 }
  #camera-panel[hidden], progress[hidden] { display: none }
</style>
<h1>Photo Gallery</h1>
<p>Upload original photos or capture from the USB camera connected to the Pi.</p>
<button id="live-camera">Live camera</button>
<section id="camera-panel" hidden>
  <div class="camera-controls">
    <label for="camera-mode">Capture resolution</label>
    <select id="camera-mode" disabled></select>
    <button id="camera-apply" disabled>Apply</button>
    <button id="camera-reload">Refresh modes</button>
  </div>
  <img id="camera-view" alt="Live USB camera preview">
  <p id="camera-status" role="status">Connecting to camera...</p>
  <button id="camera-capture" disabled>Capture</button>
  <button id="camera-close">Back</button>
</section>
<section>
  <h2>Upload images</h2>
  <input id="original" type="file">
  <button id="upload">Upload</button>
</section>
<progress id="progress" max="100" value="0" hidden></progress>
<p id="status" role="status"></p>
<h2>Stored images</h2>
<ul id="files"></ul>
<script>
const original = document.querySelector('#original');
const status = document.querySelector('#status');
const progress = document.querySelector('#progress');
const files = document.querySelector('#files');
const cameraPanel = document.querySelector('#camera-panel');
const cameraView = document.querySelector('#camera-view');
const cameraStatus = document.querySelector('#camera-status');
const cameraCapture = document.querySelector('#camera-capture');
const liveCameraButton = document.querySelector('#live-camera');
const cameraModeSelect = document.querySelector('#camera-mode');
const cameraApply = document.querySelector('#camera-apply');
const cameraReload = document.querySelector('#camera-reload');
let cameraReady = false;
let cameraModes = [];

async function loadCameraModes() {
  cameraModeSelect.disabled = true;
  cameraApply.disabled = true;
  const response = await fetch('/api/camera/settings');
  if (!response.ok) throw Error(await response.text());
  const settings = await response.json();
  cameraModes = settings.modes;
  cameraModeSelect.replaceChildren();
  for (const [index, mode] of cameraModes.entries()) {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = `${mode.width} × ${mode.height} (${mode.name})`;
    cameraModeSelect.append(option);
  }
  cameraModeSelect.value = String(settings.selected);
  cameraModeSelect.disabled = false;
  cameraApply.disabled = false;
}

function startCameraPreview() {
  cameraReady = false;
  cameraCapture.disabled = true;
  cameraStatus.textContent = 'Connecting to camera...';
  cameraView.src = '/api/camera/stream?time=' + Date.now();
}

function stopCameraPreview() {
  cameraView.removeAttribute('src');
  cameraReady = false;
  cameraCapture.disabled = true;
}

async function waitForCameraRelease() {
  for (let attempt = 0; attempt < 50; attempt++) {
    const response = await fetch('/api/camera/status');
    if (!response.ok) throw Error('Could not check camera status');
    if (!(await response.json()).streaming) return;
    await new Promise(resolve => setTimeout(resolve, 100));
  }
  throw Error('Camera is still busy; close the other preview and retry');
}

liveCameraButton.onclick = async () => {
  liveCameraButton.hidden = true;
  cameraPanel.hidden = false;
  cameraStatus.textContent = 'Loading camera settings...';
  try {
    await loadCameraModes();
    if (!cameraPanel.hidden) startCameraPreview();
  } catch (error) {
    cameraStatus.textContent = 'Could not load camera settings: ' + error.message;
  }
};
document.querySelector('#camera-close').onclick = () => {
  stopCameraPreview();
  cameraPanel.hidden = true;
  liveCameraButton.hidden = false;
};
cameraView.onload = () => {
  if (cameraPanel.hidden) return;
  if (cameraReady) return;
  cameraReady = true;
  cameraCapture.disabled = false;
  cameraStatus.textContent = `Live camera ready at ${cameraModeSelect.selectedOptions[0]?.textContent || 'the selected resolution'}.`;
};
cameraView.onerror = () => {
  if (cameraPanel.hidden || !cameraView.hasAttribute('src')) return;
  cameraReady = false;
  cameraCapture.disabled = true;
  cameraStatus.textContent = 'Could not start the camera. Check that the USB camera is connected and not open on the Pi.';
};
cameraReload.onclick = async () => {
  try {
    await loadCameraModes();
    cameraStatus.textContent = 'Camera modes refreshed.';
  } catch (error) {
    cameraStatus.textContent = 'Could not refresh camera modes: ' + error.message;
  }
};
cameraApply.onclick = async () => {
  const mode = cameraModes[Number(cameraModeSelect.value)];
  if (!mode) return;
  cameraApply.disabled = true;
  stopCameraPreview();
  cameraStatus.textContent = 'Applying camera resolution...';
  try {
    await waitForCameraRelease();
    const query = new URLSearchParams({width: mode.width, height: mode.height, format: mode.format});
    await request('/api/camera/settings?' + query, {method: 'POST'});
    if (!cameraPanel.hidden) startCameraPreview();
  } catch (error) {
    cameraStatus.textContent = 'Could not apply camera resolution: ' + error.message;
  } finally {
    cameraApply.disabled = cameraModeSelect.disabled;
  }
};
cameraCapture.onclick = async () => {
  cameraCapture.disabled = true;
  cameraStatus.textContent = 'Capturing...';
  try {
    const response = await fetch('/api/camera/capture', {method: 'POST'});
    if (!response.ok) throw Error(await response.text());
    const name = response.headers.get('X-Photo-Name');
    if (!name) throw Error('Photo was saved on the Pi, but no download name was returned');
    const blob = await response.blob();
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = name;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    const manualDownload = document.createElement('a');
    manualDownload.href = '/file?name=' + encodeURIComponent(name);
    manualDownload.download = name;
    manualDownload.textContent = 'Download again';
    cameraStatus.replaceChildren(
      document.createTextNode(`Saved ${name} to the Pi gallery and started its download on this device. `),
      manualDownload
    );
    await refresh();
  } catch (error) {
    cameraStatus.textContent = 'Capture failed: ' + error.message;
  } finally {
    cameraCapture.disabled = cameraPanel.hidden || !cameraReady;
  }
};

async function request(url, options) {
  const response = await fetch(url, options);
  const message = await response.text();
  if (!response.ok) throw Error(message || `HTTP ${response.status}`);
  return message;
}

async function refresh() {
  try {
    const response = await fetch('/api/files');
    if (!response.ok) throw Error(await response.text());
    const entries = await response.json();
    files.replaceChildren();
    for (const item of entries) {
      const row = document.createElement('li');
      const title = document.createElement('span');
      title.textContent = `${item.name} (${Math.ceil(item.size / 1024)} KB)`;
      row.append(title);
      const download = document.createElement('a');
      download.href = '/file?name=' + encodeURIComponent(item.name);
      download.textContent = 'Download';
      row.append(download);
      for (const [label, action] of [
        ['Copy', async () => {
          const to = prompt('Copy to filename:', item.name);
          if (to) await request('/copy?from=' + encodeURIComponent(item.name) + '&to=' + encodeURIComponent(to), {method:'POST'});
        }],
        ['Rename', async () => {
          const to = prompt('New filename:', item.name);
          if (to) await request('/rename?from=' + encodeURIComponent(item.name) + '&to=' + encodeURIComponent(to), {method:'POST'});
        }],
        ['Delete', async () => {
          if (confirm('Delete ' + item.name + '?'))
            await request('/delete?name=' + encodeURIComponent(item.name), {method:'DELETE'});
        }]
      ]) {
        const button = document.createElement('button');
        button.textContent = label;
        button.onclick = async () => {
          try { await action(); await refresh(); status.textContent = label + ' complete'; }
          catch (error) { status.textContent = error.message; }
        };
        row.append(button);
      }
      files.append(row);
    }
  } catch (error) {
    status.textContent = 'Could not list files: ' + error.message;
  }
}

function send(blob, name) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    progress.hidden = false;
    progress.value = 0;
    status.textContent = 'Uploading...';
    xhr.upload.onprogress = event => {
      if (event.lengthComputable) {
        progress.value = 100 * event.loaded / event.total;
        status.textContent = 'Uploading: ' + Math.round(progress.value) + '%';
      }
    };
    xhr.onload = () => xhr.status >= 200 && xhr.status < 300
      ? resolve(xhr.responseText) : reject(Error(xhr.responseText || `HTTP ${xhr.status}`));
    xhr.onerror = () => reject(Error('Network error'));
    xhr.open('PUT', '/upload?name=' + encodeURIComponent(name));
    xhr.send(blob);
  });
}

document.querySelector('#upload').onclick = async () => {
  const selected = original.files[0];
  if (!selected) return;
  try { await send(selected, selected.name); status.textContent = 'Uploaded ' + selected.name; await refresh(); }
  catch (error) { status.textContent = error.message; }
};

refresh();
</script>
</html>
