# Private Pi 4 network-boot link on the host's eno1 port.
port=0
interface=eno1
bind-dynamic
dhcp-authoritative
dhcp-range=10.42.0.100,10.42.0.100,255.255.255.0,12h
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-boot=bootcode.bin,,10.42.0.1
enable-tftp
tftp-root=/srv/photo-viewer-netboot/tftp
log-dhcp
