# Custom layer for the Raspberry Pi LVGL photo viewer.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "photo_viewer"
BBFILE_PATTERN_photo_viewer = "^${LAYERDIR}/"
BBFILE_PRIORITY_photo_viewer = "7"
LAYERSERIES_COMPAT_photo_viewer = "scarthgap"

