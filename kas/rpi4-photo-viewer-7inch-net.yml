# Raspberry Pi 4 network boot with the 7-inch Waveshare display.
header:
  version: 14
  includes:
    - kas/rpi4-photo-viewer-7inch.yml

local_conf_header:
  photo-viewer-7inch-net: |
    PHOTO_VIEWER_BOOT_MEDIA = "net"
    IMAGE_BASENAME:pn-photo-viewer-image = "photo-viewer-image-7inch-net"
    IMAGE_FSTYPES = "tar.bz2"
    CMDLINE_ROOTFS = "root=/dev/nfs nfsroot=10.42.0.1:/srv/photo-viewer-netboot/rootfs,vers=3,tcp rw ip=dhcp rootwait"
